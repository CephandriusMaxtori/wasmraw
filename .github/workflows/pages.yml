name: Build WASM and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Pinned so the toolchain is reproducible and the cache key is stable.
  # Bump this to pick up a new Emscripten release; it is the only line to change.
  EMSDK_VERSION: '6.0.10'

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Restore Emscripten cache
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
          restore-keys: |
            emsdk-${{ runner.os }}-

      - name: Restore ImGui cache
        id: cache-imgui
        uses: actions/cache@v4
        with:
          path: ~/imgui
          key: imgui-${{ runner.os }}-docking
          restore-keys: |
            imgui-${{ runner.os }}-

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('app/decoder.cpp', 'app/tone_common.h', 'app/third_party/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install Emscripten
        run: |
          if [ ! -d "$HOME/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - name: Install Dear ImGui
        run: |
          if [ ! -d "$HOME/imgui/.git" ]; then
            git clone --depth 1 --branch docking https://github.com/ocornut/imgui.git "$HOME/imgui"
          fi

      - name: Report cache status
        run: |
          {
            echo "## Caches"
            echo ""
            echo "| Cache | Result |"
            echo "| --- | --- |"
            echo "| emsdk | ${{ steps.cache-emsdk.outputs.cache-hit == 'true' && 'exact hit' || 'restored or miss' }} |"
            echo "| imgui | ${{ steps.cache-imgui.outputs.cache-hit == 'true' && 'exact hit' || 'restored or miss' }} |"
            echo "| ccache | ${{ steps.cache-ccache.outputs.cache-hit == 'true' && 'exact hit' || 'restored or miss' }} |"
            echo ""
            echo "Emscripten: \`$EMSDK_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure CMake
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          emcmake cmake -G Ninja -B build-wasm -DCMAKE_BUILD_TYPE=Release -DIMGUI_DIR="$HOME/imgui" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache .

      - name: Build WASM modules
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          cmake --build build-wasm
          cp app/decoder-worker.js build-wasm/decoder-worker.js

      - name: Run headless smoke test
        env:
          EMCC_USE_CCACHE: '1'
        run: |
          set -o pipefail
          source "$EMSDK/emsdk_env.sh" > /dev/null
          cd smoke
          python make_test_dng.py
          em++ -O2 \
            -I../app -I../app/third_party \
            -I../RawTherapee/rtengine/libraw -I../RawTherapee/rtengine/libraw/libraw \
            ../app/decoder.cpp smoke_main.cpp ../app/third_party/stb_image_write.cpp \
            ../build-wasm/librtlibraw.a \
            --preload-file test.dng@/test.dng \
            -o smoke.js -sEXPORTED_FUNCTIONS=_main -sNO_EXIT_RUNTIME=1
          node smoke.js test.dng 2>&1 | tee ../smoke-log.txt
          {
            echo "## Smoke test"
            echo '```'
            cat ../smoke-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages
          cp build-wasm/wasmraw.html pages/index.html
          cp build-wasm/wasmraw.html build-wasm/wasmraw.js build-wasm/wasmraw.wasm pages/
          cp build-wasm/decoder.js build-wasm/decoder.wasm build-wasm/decoder-worker.js pages/
          cp logo.svg pages/logo.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Upload downloadable site build
        uses: actions/upload-artifact@v4
        with:
          name: wasmraw-site
          path: pages
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasmraw-build-logs
          path: smoke-log.txt
          retention-days: 30
          if-no-files-found: warn

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
