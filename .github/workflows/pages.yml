name: Build WASM and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - name: Install Dear ImGui
        run: git clone --depth 1 --branch docking https://github.com/ocornut/imgui.git "$HOME/imgui"

      - name: Configure CMake
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          emcmake cmake -G Ninja -B build-wasm -DCMAKE_BUILD_TYPE=Release -DIMGUI_DIR="$HOME/imgui" .

      - name: Build WASM modules
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          cmake --build build-wasm
          cp app/decoder-worker.js build-wasm/decoder-worker.js

      - name: Run headless smoke test
        run: |
          source "$EMSDK/emsdk_env.sh" > /dev/null
          cd smoke
          python make_test_dng.py
          em++ -O2 \
            -I../app -I../app/third_party \
            -I../RawTherapee/rtengine/libraw -I../RawTherapee/rtengine/libraw/libraw \
            ../app/decoder.cpp smoke_main.cpp ../app/third_party/stb_image_write.cpp \
            ../build-wasm/librtlibraw.a \
            --preload-file test.dng@/test.dng \
            -o smoke.js -sEXPORTED_FUNCTIONS=_main -sNO_EXIT_RUNTIME=1
          node smoke.js test.dng

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages
          cp build-wasm/wasmraw.html pages/index.html
          cp build-wasm/wasmraw.html build-wasm/wasmraw.js build-wasm/wasmraw.wasm pages/
          cp build-wasm/decoder.js build-wasm/decoder.wasm build-wasm/decoder-worker.js pages/
          cp logo.svg pages/logo.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
