<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>RawTherapee WASM</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #141416;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #canvas {
        border: 0; background: #000;
        display: block;
        position: fixed;
        left: 0; top: 0;
        width: 100vw; height: 100vh;
      }
      #splash {
        position: fixed; inset: 0;
        display: flex;
        align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, rgba(24,24,28,0.92), rgba(10,10,12,0.98));
        z-index: 40;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      #splash.hide { opacity: 0; }
      #splash .card {
        text-align: center;
        padding: 26px 40px;
        border: 1px solid #2c2c31;
        border-radius: 10px;
        background: rgba(16,16,19,0.9);
        box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      }
      #splash .logo {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #e8eaf0;
        margin-bottom: 10px;
      }
      #splash .logo span { color: #6f8fd8; }
      #splashStatus {
        font-size: 13px;
        color: #cfcfd4;
        min-height: 18px;
        margin-bottom: 8px;
      }
      #splashStatus.err { color: #ff9b9b; }
      #splashStatus.ok  { color: #b9e6c1; }
      #splash .instructions {
        font-size: 12px;
        color: #8b8b94;
      }
      #progress {
        width: 300px;
        height: 8px;
        border-radius: 4px;
        background: #2a2a31;
        overflow: hidden;
        position: relative;
        margin: 12px auto 14px;
      }
      #progress .fill {
        height: 100%;
        width: 0%;
        background: #4f7ad4;
        border-radius: 4px;
        transition: width 0.3s ease;
      }
      #progress .fizz {
        position: absolute;
        top: 0; bottom: 0; left: 0;
        width: 45%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
        transform: translateX(-120%);
        animation: sweep 1.1s linear infinite;
        will-change: transform;
        pointer-events: none;
      }
      @keyframes sweep {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(580%); }
      }
      #drop {
        position: fixed; inset: 0;
        display: none;
        z-index: 60;
        background: rgba(30, 34, 44, 0.75);
        border: 3px dashed #6f8fd8;
        color: #dfe8ff;
        font-size: 28px;
        text-align: center;
        padding-top: 18vh;
        pointer-events: none;
      }
      #drop.on { display: block; }
      #fileInput { display: none; }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    <div id="splash">
      <div class="card">
        <div class="logo">RawTherapee <span>WASM</span></div>
        <div id="splashStatus">Loading runtime...</div>
        <div id="progress"><div class="fill"></div><div class="fizz"></div></div>
        <div class="instructions">Drop RAW files anywhere, double-click, or press Ctrl+O</div>
      </div>
    </div>
    <div id="drop">Drop RAW files</div>
    <input type="file" id="fileInput" multiple accept=".raw,.RAW,.cr2,.cr3,.nef,.arw,.dng,.orf,.rw2,.pef,.srw,.raf,.raw,image/*">

    <script type='text/javascript'>
      var splashEl = document.getElementById('splash');
      var statusEl = document.getElementById('splashStatus');
      var progressFill = document.getElementById('progress').firstElementChild;
      var canvasElement = document.getElementById('canvas');
      var inputElement = document.getElementById('fileInput');
      var dropEl = document.getElementById('drop');
      var runtimeReady = false;
      var decodeWorker = null;
      var decodeBusy = false;
      var activeImageId = 0;
      var activeWorkerImageId = 0;
      var desiredImageId = 0;
      var nextImageId = 1;
      var nextRequestId = 1;
      var imageCatalog = [];
      var pendingDecodes = [];
      var pendingPreview = null;
      var previewTimer = null;

      function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = cls || '';
      }

      function setProgress(pct, label) {
        progressFill.style.width = pct + '%';
        if (label) setStatus(label);
      }

      function hideSplash() {
        splashEl.classList.add('hide');
      }

      function strToPtr(s) {
        var n = (s.length + 1) * 4;
        var p = Module._malloc(n);
        Module.stringToUTF8(s, p, n);
        return p;
      }

      function findRecord(id) {
        for (var i = 0; i < imageCatalog.length; ++i)
          if (imageCatalog[i].id === id) return imageCatalog[i];
        return null;
      }

      function addRecord(file, bytes, name) {
        if (!runtimeReady || !Module._wasm_add_image) return null;
        var id = nextImageId++;
        var record = {
          id: id,
          file: file || null,
          bytes: bytes || null,
          name: name || (file && file.name) || 'image-' + id,
          status: 'Queued',
          loaded: false,
          workerReady: false,
          decodeQueued: false,
          revision: 0,
          previewRequestId: 0,
          lastPreview: null
        };
        imageCatalog.push(record);
        var namePtr = strToPtr(record.name);
        try {
          Module._wasm_add_image(id, namePtr);
        } finally {
          Module._free(namePtr);
        }
        return record;
      }

      function queueDecode(record) {
        if (!record || record.decodeQueued) return;
        if (activeWorkerImageId === record.id && record.workerReady) return;
        record.decodeQueued = true;
        record.status = 'Reading';
        if (record.bytes) {
          pendingDecodes.push(record);
          pumpDecodeQueue();
          return;
        }
        if (!record.file) {
          record.status = 'Missing file';
          return;
        }
        var reader = new FileReader();
        reader.onload = function (event) {
          if (!record.decodeQueued) return;
          record.bytes = new Uint8Array(event.target.result);
          pendingDecodes.push(record);
          pumpDecodeQueue();
        };
        reader.onerror = function () {
          record.decodeQueued = false;
          record.status = 'Read error';
          setStatus('Could not read ' + record.name, 'err');
        };
        reader.readAsArrayBuffer(record.file);
      }

      function pumpDecodeQueue() {
        if (decodeBusy || !decodeWorker || !pendingDecodes.length) return;
        var index = 0;
        if (desiredImageId) {
          for (var i = 0; i < pendingDecodes.length; ++i) {
            if (pendingDecodes[i].id === desiredImageId) { index = i; break; }
          }
        }
        var record = pendingDecodes.splice(index, 1)[0];
        var bytes = record.bytes;
        record.bytes = null;
        record.decodeQueued = false;
        if (!bytes || !bytes.length) {
          record.status = 'Empty file';
          pumpDecodeQueue();
          return;
        }
        decodeBusy = true;
        activeWorkerImageId = record.id;
        for (var j = 0; j < imageCatalog.length; ++j)
          imageCatalog[j].workerReady = false;
        record.status = 'Decoding';
        record.requestId = nextRequestId++;
        var ab = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        try {
          decodeWorker.postMessage({
            cmd: 'decode',
            imageId: record.id,
            requestId: record.requestId,
            file: ab,
            name: record.name
          }, [ab]);
        } catch (error) {
          decodeBusy = false;
          record.status = 'Worker error';
          setStatus('postMessage failed: ' + error, 'err');
          pumpDecodeQueue();
        }
      }

      function selectImage(id) {
        var record = findRecord(id);
        if (!record) return;
        activeImageId = id;
        desiredImageId = id;
        if (Module._wasm_select_image) Module._wasm_select_image(id);
        setStatus(record.status === 'Queued' ? 'Loading ' + record.name : record.status);
        if (activeWorkerImageId === id && record.workerReady) {
          hideSplash();
          return;
        }
        queueDecode(record);
      }

      function addFiles(files) {
        var added = [];
        for (var i = 0; i < files.length; ++i) {
          var record = addRecord(files[i], null, files[i].name);
          if (record) added.push(record);
        }
        if (added.length && !activeImageId) selectImage(added[0].id);
        if (added.length > 1) setStatus(added.length + ' images added');
      }

      function loadBytes(bytes, name) {
        var record = addRecord(null, new Uint8Array(bytes), name || 'byte-buffer');
        if (record) selectImage(record.id);
        return record ? record.id : 0;
      }

      function updateRecordStatus(id, status) {
        var record = findRecord(id);
        if (!record) return;
        record.status = status;
        if (Module._wasm_set_image_status) {
          var statusPtr = strToPtr(status);
          Module._wasm_set_image_status(id, statusPtr);
          Module._free(statusPtr);
        }
        if (id === activeImageId) setStatus(status);
      }

      function onWorkerMessage(event) {
        var message = event.data || {};
        switch (message.type) {
          case 'ready':
            console.log('decoder: ready');
            pumpDecodeQueue();
            break;
          case 'progress': {
            var progressRecord = findRecord(message.imageId);
            if (!progressRecord || progressRecord.requestId !== message.requestId) break;
            updateRecordStatus(message.imageId, message.label || 'Working');
            if (message.imageId === activeImageId) setProgress(message.pct || 0, message.label);
            break;
          }
          case 'decoded': {
            var record = findRecord(message.imageId);
            if (!record || record.requestId !== message.requestId) break;
            decodeBusy = false;
            var nbytes = message.pw * message.ph * 3 * 4;
            var ptr = Module._malloc(nbytes);
            Module.writeArrayToMemory(new Uint8Array(message.preview), ptr);
            var makePtr = strToPtr(message.make || '');
            var modelPtr = strToPtr(message.model || '');
            var lensPtr = strToPtr(message.lens || '');
            var statusPtr = strToPtr(message.status || '');
            try {
              Module._wasm_accept_decode(message.imageId, ptr, message.w, message.h,
                message.pw, message.ph, message.iso, message.shutter,
                message.aperture, message.focal, makePtr, modelPtr, lensPtr, statusPtr);
            } finally {
              Module._free(makePtr);
              Module._free(modelPtr);
              Module._free(lensPtr);
              Module._free(statusPtr);
              Module._free(ptr);
            }
            record.loaded = true;
            record.workerReady = true;
            record.status = 'Ready';
            record.requestId = message.requestId || record.requestId;
            activeWorkerImageId = message.imageId;
            if (message.imageId === activeImageId) {
              setProgress(100, record.status);
              hideSplash();
            }
            pumpDecodeQueue();
            break;
          }
          case 'preview': {
            var previewRecord = findRecord(message.imageId);
            if (!previewRecord || previewRecord.previewRequestId !== message.requestId ||
                previewRecord.revision !== message.revision) break;
            var previewSize = message.w * message.h * 4;
            var previewPtr = Module._malloc(previewSize);
            Module.writeArrayToMemory(new Uint8Array(message.bytes), previewPtr);
            try {
              Module._wasm_accept_preview(message.imageId, previewPtr, message.w, message.h,
                message.quality || 1, message.revision);
            } finally {
              Module._free(previewPtr);
            }
            if (message.quality === 0 && previewRecord.revision === message.revision &&
                previewRecord.lastPreview && activeWorkerImageId === message.imageId) {
              var finalRequest = Object.assign({}, previewRecord.lastPreview);
              finalRequest.requestId = nextRequestId++;
              finalRequest.quality = 1;
              previewRecord.previewRequestId = finalRequest.requestId;
              decodeWorker.postMessage(finalRequest);
            }
            if (message.imageId === activeImageId) setStatus('Ready');
            break;
          }
          case 'preview-error': {
            updateRecordStatus(message.imageId || activeImageId, message.msg || 'Preview error');
            break;
          }
          case 'exported': {
            var exportRecord = findRecord(message.imageId);
            var statusPtr2 = strToPtr(message.status || '');
            Module._wasm_set_export_status(message.imageId, statusPtr2);
            Module._free(statusPtr2);
            var baseName = exportRecord ? exportRecord.name.replace(/\.[^.]+$/, '') : 'rawtherapee-export';
            downloadBytes(new Uint8Array(message.bytes), baseName + (message.fmt ? '.jpg' : '.png'),
              message.fmt ? 'image/jpeg' : 'image/png');
            break;
          }
          case 'export-error': {
            var errorPtr = strToPtr(message.msg || 'Export failed');
            Module._wasm_set_export_status(message.imageId || activeImageId, errorPtr);
            Module._free(errorPtr);
            break;
          }
          case 'error': {
            var errorRecord = findRecord(message.imageId || 0);
            if (errorRecord && errorRecord.requestId !== message.requestId) break;
            decodeBusy = false;
            updateRecordStatus(message.imageId || 0, message.msg || 'Decoder error');
            if (message.imageId === activeImageId) setStatus(message.msg || 'Decoder error', 'err');
            pumpDecodeQueue();
            break;
          }
        }
      }

      function downloadBytes(bytes, name, type) {
        var blob = new Blob([bytes], { type: type });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = name;
        document.body.appendChild(link);
        link.click();
        setTimeout(function () { URL.revokeObjectURL(link.href); }, 2000);
        link.remove();
      }

      function requestPreview(imageId, revision, exp, black, white, contrast, sat,
                              temperature, tint, wbR, wbG, wbB, vignette,
                              clarity, clarityRadius, sharpening, sharpenRadius,
                              denoise, vibrance, ca, distortion, shadows, highlights,
                              cy0, cy1, cy2, cy3, cy4, quality) {
        var record = findRecord(imageId);
        if (!record || !decodeWorker) return;
        record.revision = revision;
        pendingPreview = {
          cmd: 'process', imageId: imageId, requestId: nextRequestId++,
          revision: revision, exp: exp, black: black, white: white,
          contrast: contrast, sat: sat, temperature: temperature, tint: tint,
          wbR: wbR, wbG: wbG, wbB: wbB, vignette: vignette,
          clarity: clarity, clarityRadius: clarityRadius,
          sharpening: sharpening, sharpenRadius: sharpenRadius,
          denoise: denoise, vibrance: vibrance, ca: ca, distortion: distortion,
          shadows: shadows, highlights: highlights,
          cy0: cy0, cy1: cy1, cy2: cy2, cy3: cy3, cy4: cy4,
          quality: quality === undefined ? 1 : quality
        };
        record.lastPreview = pendingPreview;
        record.previewRequestId = pendingPreview.requestId;
        if (previewTimer) return;
        previewTimer = setTimeout(function () {
          previewTimer = null;
          var request = pendingPreview;
          pendingPreview = null;
          if (request && activeWorkerImageId === request.imageId)
            decodeWorker.postMessage(request);
        }, 30);
      }

      function requestExport(imageId, revision, fmt, fullRes, exp, black, white, contrast, sat,
                             temperature, tint, wbR, wbG, wbB, vignette,
                             clarity, clarityRadius, sharpening, sharpenRadius,
                             denoise, vibrance, ca, distortion, shadows, highlights,
                             cy0, cy1, cy2, cy3, cy4, quality) {
        if (!decodeWorker) return;
        if (activeWorkerImageId !== imageId) {
          updateRecordStatus(imageId, 'Select image before exporting');
          return;
        }
        decodeWorker.postMessage({
          cmd: 'export', imageId: imageId, requestId: nextRequestId++, revision: revision,
          fmt: fmt, fullRes: fullRes, exp: exp, black: black, white: white, contrast: contrast, sat: sat,
          temperature: temperature, tint: tint, wbR: wbR, wbG: wbG, wbB: wbB,
          vignette: vignette, clarity: clarity, clarityRadius: clarityRadius,
          sharpening: sharpening, sharpenRadius: sharpenRadius, denoise: denoise,
          vibrance: vibrance, ca: ca, distortion: distortion,
          shadows: shadows, highlights: highlights,
          cy0: cy0, cy1: cy1, cy2: cy2, cy3: cy3, cy4: cy4,
          quality: Math.floor(quality)
        });
      }

      window._wasmraw = {
        get ready() { return runtimeReady; },
        decode: function (bytes, name) { return loadBytes(bytes, name); },
        select: function (id) { selectImage(id); },
        requestPreview: requestPreview,
        requestExport: requestExport
      };

      canvasElement.addEventListener('webglcontextlost', function (event) {
        alert('WebGL context lost. You will need to reload the page.');
        event.preventDefault();
      }, false);

      function fitCanvas() {
        var dpr = window.devicePixelRatio || 1;
        canvasElement.width = Math.round(window.innerWidth * dpr);
        canvasElement.height = Math.round(window.innerHeight * dpr);
      }
      window.addEventListener('resize', function () { if (runtimeReady) fitCanvas(); });

      var dragDepth = 0;
      window.addEventListener('dragenter', function (event) {
        event.preventDefault();
        if (event.dataTransfer && event.dataTransfer.types &&
            Array.prototype.indexOf.call(event.dataTransfer.types, 'Files') !== -1) {
          dragDepth++;
          dropEl.classList.add('on');
        }
      });
      window.addEventListener('dragover', function (event) { event.preventDefault(); });
      window.addEventListener('dragleave', function (event) {
        event.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) dropEl.classList.remove('on');
      });
      window.addEventListener('drop', function (event) {
        event.preventDefault();
        dragDepth = 0;
        dropEl.classList.remove('on');
        if (event.dataTransfer && event.dataTransfer.files) addFiles(event.dataTransfer.files);
      });
      canvasElement.addEventListener('dblclick', function (event) {
        if (Module._wasm_control_hovered && Module._wasm_control_hovered()) {
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        inputElement.click();
      });
      window.addEventListener('keydown', function (event) {
        if (event.key === 'o' && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          inputElement.click();
        }
      });
      inputElement.addEventListener('change', function () {
        if (inputElement.files && inputElement.files.length) addFiles(inputElement.files);
        inputElement.value = '';
      });

      var Module = {
        print: function () { console.log.apply(console, arguments); },
        printErr: function () { console.error.apply(console, arguments); },
        canvas: canvasElement,
        setStatus: function (text) { if (text) setStatus(text); },
        onAbort: function (text) { setStatus('Runtime aborted: ' + text, 'err'); },
        onRuntimeInitialized: function () {
          runtimeReady = true;
          fitCanvas();
          console.log('wasmraw: runtime initialized');
          setStatus('Ready - drop RAW files, double-click, or press Ctrl+O');
          try {
            if (typeof Worker === 'undefined') throw new Error('Worker API unavailable');
            decodeWorker = new Worker('decoder-worker.js');
            decodeWorker.onmessage = onWorkerMessage;
            decodeWorker.onerror = function (event) {
              setStatus('Decoder worker error: ' + (event.message || 'unknown'), 'err');
            };
            console.log('decoder: worker spawned');
          } catch (error) {
            setStatus('Could not start decoder worker: ' + error, 'err');
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function (left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          if (left) setStatus('Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')');
        }
      };
      window.onerror = window.onunhandledrejection = function (message, source, line, column, error) {
        setStatus('Exception: ' + (error && error.message ? error.message : message), 'err');
      };
      setTimeout(function () {
        if (runtimeReady) return;
        var moduleDefined = typeof Module !== 'undefined';
        var detail = 'wasmraw.js loaded: ' + (moduleDefined ? 'yes' : 'NO');
        if (moduleDefined) {
          detail += '; HEAPU8: ' + (Module.HEAPU8 ? 'yes' : 'no') +
            '; _wasm_add_image: ' + (Module._wasm_add_image ? 'yes' : 'no');
        }
        console.error('wasmraw startup watchdog fired after 10s:', detail);
        setStatus('Startup never finished. ' + detail + ' - check DevTools console / Network tab.', 'err');
      }, 10000);
      (function featureCheck() {
        if (typeof WebAssembly === 'undefined') {
          setStatus('WebAssembly is not supported in this browser', 'err');
          return;
        }
        var probe = document.createElement('canvas');
        if (!probe.getContext('webgl2'))
          setStatus('WebGL2 is not available - check hardware acceleration / GPU settings', 'err');
      })();
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
